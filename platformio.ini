; =====================================================
; Sistema Ambiental ESP32
;
;  Firmware principal ........ pio run -e esp32dev
;  Prueba de un componente ... pio run -e t01_dht22   (ver lista abajo)
;  Pruebas del PC (logica) ... pio test -e native
; =====================================================

[platformio]
default_envs = esp32dev

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    knolleary/PubSubClient@^2.8

; ---------- Firmware principal ----------
[env:esp32dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

; ---------- Pruebas unitarias en el PC (sin hardware) ----------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Iinclude

; ---------- Pruebas de componentes (cargar en el ESP32 / Wokwi) ----------
[env:t01_dht22]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_src_filter = -<*> +<../pruebas/t01_dht22.cpp>
build_flags = -Ipruebas

